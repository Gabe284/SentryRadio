# Forensic Radio Suite Config
android.useAndroidX=true
android.enableJetifier=true

# Enable Gradle task-output caching across CI runs.
org.gradle.caching=true

# The default 512 MiB heap caused the Android/Kotlin build daemon to thrash GC.
# Bound worker concurrency to keep memory predictable on CI and smaller local devices.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g

# Disable experimental DSL to allow KSP stability in A16
android.builtInKotlin=false
android.newDsl=false

# Room schema location
room.schemaLocation=$projectDir/schemas
