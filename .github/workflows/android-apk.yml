name: Android APK (MediaTek port)

on:
  workflow_dispatch:
  push:
    branches:
      - mtk-kansas
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - mtk-kansas

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0'

      - name: Enable Gradle wrapper
        run: chmod u+x ./gradlew

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Print toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Verify packaged MediaTek module baseline
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/sentry_module/module.prop"
          unzip -l "$APK" | grep -F "assets/sentry_module/common/service.sh"
          unzip -l "$APK" | grep -F "assets/sentry_module/system/bin/sentry-ctl"
          unzip -l "$APK" | grep -F "assets/sentry_module/system/bin/chipsets/detect.sh"
          unzip -l "$APK" | grep -F "assets/sentry_module/system/bin/chipsets/qualcomm/sentry-ctl"
          unzip -l "$APK" | grep -F "assets/sentry_module/system/bin/chipsets/mediatek/sentry-ctl"
          unzip -p "$APK" assets/sentry_module/module.prop | grep -F "version=v0.5.0-mtk1"
          unzip -p "$APK" assets/sentry_module/module.prop | grep -F "versionCode=10"
          unzip -p "$APK" assets/sentry_module/common/service.sh
          sha256sum "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-radio-mtk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-radio-build-diagnostics
          path: |
            app/build/reports/tests/
            app/build/reports/problems/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
